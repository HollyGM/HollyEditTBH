name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: hollyedittbh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Prepare Taskbar Hero test path
        shell: pwsh
        run: |
          $gameDir = Join-Path $HOME 'AppData\LocalLow\TesseractStudio\TaskbarHero'
          New-Item -ItemType Directory -Force -Path $gameDir | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $gameDir 'SaveFile_Live.es3') | Out-Null
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run regression suite
        run: python -m unittest -v test_hollyedittbh.py test_intelligence_v33.py test_market_ranking_v33.py test_hero_profiles_v33.py test_final_audit_v331.py test_hardening_v332.py test_v340_coins_and_policy.py test_v341_ux_and_portability.py test_v342_stash_geometry.py test_item_persistence.py
      - name: Smoke test compatibility source entry
        shell: pwsh
        run: |
          $process = Start-Process -FilePath python -ArgumentList 'tbh_save_editor.py' -PassThru
          Start-Sleep -Seconds 3
          $process.Refresh()
          if ($process.HasExited) { throw "tbh_save_editor.py encerrou durante o smoke test com código $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Entrada de compatibilidade redirecionou e permaneceu ativa por 3 segundos.'
      - name: Install pinned PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm HollyEditTBH.spec
      - name: Verify executable metadata
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\HollyEditTBH.exe'
          if (!(Test-Path $exe)) { throw 'HollyEditTBH.exe não foi gerado' }
          $item = Get-Item $exe
          $fileVersion = ([string]$item.VersionInfo.FileVersion).Trim()
          $productVersion = ([string]$item.VersionInfo.ProductVersion).Trim()
          $allowedVersions = @('3.4.3', '3.4.3.0')
          Write-Host "Executável gerado: $($item.Length) bytes · FileVersion $fileVersion · ProductVersion $productVersion"
          if ($allowedVersions -notcontains $fileVersion) { throw "FileVersion inesperada: $fileVersion" }
          if ($allowedVersions -notcontains $productVersion) { throw "ProductVersion inesperada: $productVersion" }
      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\HollyEditTBH.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) { throw "HollyEditTBH.exe encerrou durante o smoke test com código $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Startup do HollyEditTBH.exe validado por 5 segundos.'
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\HollyEditTBH.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash  HollyEditTBH.exe" | Set-Content -Encoding ascii (Join-Path $PWD 'dist\SHA256SUMS.txt')
          Write-Host "SHA-256: $hash"
      - name: Verify distribution contents
        shell: pwsh
        run: |
          $actual = @(Get-ChildItem (Join-Path $PWD 'dist') -File | ForEach-Object Name | Sort-Object)
          $expected = @('HollyEditTBH.exe', 'SHA256SUMS.txt') | Sort-Object
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($difference.Count -ne 0) {
            Write-Host 'Conteúdo inesperado em dist:'
            $actual | ForEach-Object { Write-Host " - $_" }
            throw 'O pacote contém arquivo ausente ou não autorizado.'
          }
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HollyEditTBH-v3.4.3-windows
          path: |
            dist/HollyEditTBH.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install Tk and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run regression suite
        run: xvfb-run -a python -m unittest -v test_hollyedittbh.py test_intelligence_v33.py test_market_ranking_v33.py test_hero_profiles_v33.py test_final_audit_v331.py test_hardening_v332.py test_v340_coins_and_policy.py test_v341_ux_and_portability.py test_v342_stash_geometry.py test_item_persistence.py
      - name: Install pinned PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Build Linux binary
        run: pyinstaller --clean --noconfirm HollyEditTBH.spec
      - name: Smoke test Linux binary
        run: |
          test -x dist/HollyEditTBH || { echo 'binário Linux não foi gerado'; exit 1; }
          xvfb-run -a ./dist/HollyEditTBH &
          pid=$!
          sleep 8
          kill -0 "$pid" || { echo 'HollyEditTBH encerrou durante o smoke test'; exit 1; }
          kill "$pid" 2>/dev/null || true
          echo 'Startup do binário Linux validado por 8 segundos.'
      - name: Generate SHA-256 checksum
        run: |
          cd dist
          sha256sum HollyEditTBH > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HollyEditTBH-v3.4.3-linux
          path: |
            dist/HollyEditTBH
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run regression suite
        run: python -m unittest -v test_hollyedittbh.py test_intelligence_v33.py test_market_ranking_v33.py test_hero_profiles_v33.py test_final_audit_v331.py test_hardening_v332.py test_v340_coins_and_policy.py test_v341_ux_and_portability.py test_v342_stash_geometry.py test_item_persistence.py
      - name: Install pinned PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Build macOS bundle
        run: pyinstaller --clean --noconfirm HollyEditTBH.spec
      - name: Verify macOS bundle layout
        run: |
          test -d dist/HollyEditTBH.app || { echo 'HollyEditTBH.app não foi gerado'; exit 1; }
          test -x dist/HollyEditTBH.app/Contents/MacOS/HollyEditTBH || { echo 'executável do bundle ausente'; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/HollyEditTBH.app/Contents/Info.plist
      - name: Smoke test macOS bundle
        run: |
          ./dist/HollyEditTBH.app/Contents/MacOS/HollyEditTBH &
          pid=$!
          sleep 8
          kill -0 "$pid" || { echo 'HollyEditTBH encerrou durante o smoke test'; exit 1; }
          kill "$pid" 2>/dev/null || true
          echo 'Startup do bundle macOS validado por 8 segundos.'
      - name: Package macOS bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent HollyEditTBH.app HollyEditTBH-macos.zip
          shasum -a 256 HollyEditTBH-macos.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HollyEditTBH-v3.4.3-macos
          path: |
            dist/HollyEditTBH-macos.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
