name: Tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run regression suite
        run: python -m unittest -v test_hollyedittbh.py test_intelligence_v33.py
