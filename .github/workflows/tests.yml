name: Tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Taskbar Hero test path
        shell: pwsh
        run: |
          $gameDir = Join-Path $HOME 'AppData\LocalLow\TesseractStudio\TaskbarHero'
          New-Item -ItemType Directory -Force -Path $gameDir | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $gameDir 'SaveFile_Live.es3') | Out-Null
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run regression suite
        run: python -m unittest -v test_hollyedittbh.py test_intelligence_v33.py
